<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Expense - Zevi Hub</title>
<script src="https://cdn.tailwindcss.com"></script>
<link href="https://fonts.googleapis.com/css2?family=Hind+Siliguri:wght@400;600;700&display=swap" rel="stylesheet">
<style>body{font-family:'Hind Siliguri',sans-serif}.hidden{display:none!important}</style>
</head>
<body class="bg-[#080808] text-white hidden">

<div id="loading" class="fixed inset-0 bg-[#080808] flex items-center justify-center z-[100]">
  <div class="text-center"><div class="w-10 h-10 border-4 border-white/10 border-t-[#FFC300] rounded-full animate-spin mx-auto"></div><p class="text-xs text-white/40 mt-3">Expense লোড হচ্ছে...</p></div>
</div>

<div class="bg-[#121212] border-b border-white/10 p-4 flex justify-between items-center sticky top-0 z-50">
  <div class="flex gap-3 items-center">
    <button onclick="location.href='admin-hisab-dashboard.html'" class="w-9 h-9 bg-white/10 rounded-full flex items-center justify-center">←</button>
    <div><h1 class="font-black leading-none">খরচের খাতা</h1><p class="text-xs text-white/40">গাড়ি ভাড়া সহ সব খরচ</p></div>
  </div>
  <div class="flex gap-2">
    <button onclick="openAdd()" class="bg-[#FFC300] text-black px-4 py-2 rounded-full text-xs font-black">+ Add খরচ</button>
    <button onclick="window.print()" class="bg-white/10 px-4 py-2 rounded-full text-xs">🖨️</button>
  </div>
</div>

<div class="p-4 max-w-5xl mx-auto pb-28 space-y-4">

  <div class="grid grid-cols-2 md:grid-cols-4 gap-3">
    <div class="bg-[#121212] border border-white/10 p-4 rounded-2xl"><p class="text-xs text-white/40">আজকের খরচ</p><p id="todayExp" class="text-xl font-black mt-1 text-orange-400">৳0</p></div>
    <div class="bg-[#121212] border border-white/10 p-4 rounded-2xl"><p class="text-xs text-white/40">এই মাসে</p><p id="monthExp" class="text-xl font-black mt-1 text-red-400">৳0</p></div>
    <div class="bg-[#121212] border border-white/10 p-4 rounded-2xl"><p class="text-xs text-white/40">মোট খরচ</p><p id="totalExp" class="text-xl font-black mt-1">৳0</p></div>
    <div class="bg-[#121212] border border-[#FFC300]/30 p-4 rounded-2xl"><p class="text-xs text-white/40">Top Category</p><p id="topCat" class="text-sm font-black mt-1 text-[#FFC300]">-</p></div>
  </div>

  <div class="bg-[#121212] border border-white/10 rounded-3xl p-4 space-y-3">
    <input id="searchBox" onkeyup="filterExp()" placeholder="🔍 Title / Note সার্চ..." class="w-full bg-black border border-white/10 rounded-full px-4 py-3 text-sm outline-none focus:border-[#FFC300]">
    <div class="flex gap-2 flex-wrap">
      <button onclick="setCatFilter('all')" id="c-all" class="catBtn bg-[#FFC300] text-black px-4 py-2 rounded-full text-xs font-black">All</button>
      <button onclick="setCatFilter('rent')" id="c-rent" class="catBtn bg-white/10 px-3 py-2 rounded-full text-xs">🏠 Rent</button>
      <button onclick="setCatFilter('salary')" id="c-salary" class="catBtn bg-white/10 px-3 py-2 rounded-full text-xs">👷 Salary</button>
      <button onclick="setCatFilter('current')" id="c-current" class="catBtn bg-white/10 px-3 py-2 rounded-full text-xs">💡 Current</button>
      <button onclick="setCatFilter('delivery')" id="c-delivery" class="catBtn bg-white/10 px-3 py-2 rounded-full text-xs">🚚 Delivery</button>
      <button onclick="setCatFilter('garivara')" id="c-garivara" class="catBtn bg-white/10 px-3 py-2 rounded-full text-xs">🚛 গাড়ি ভাড়া</button>
      <button onclick="setCatFilter('packaging')" id="c-packaging" class="catBtn bg-white/10 px-3 py-2 rounded-full text-xs">🛍️ Pack</button>
      <button onclick="setCatFilter('food')" id="c-food" class="catBtn bg-white/10 px-3 py-2 rounded-full text-xs">🍔 Food</button>
      <button onclick="setCatFilter('marketing')" id="c-marketing" class="catBtn bg-white/10 px-3 py-2 rounded-full text-xs">📢 Marketing</button>
      <button onclick="setCatFilter('others')" id="c-others" class="catBtn bg-white/10 px-3 py-2 rounded-full text-xs">📦 Others</button>
    </div>
    <div class="flex gap-2">
      <input id="filterDate" type="date" onchange="filterExp()" class="bg-black border border-white/10 rounded-full px-4 py-2 text-xs">
      <select id="filterMonth" onchange="filterExp()" class="bg-black border border-white/10 rounded-full px-4 py-2 text-xs">
        <option value="all">All Month</option>
        <option value="0">January</option><option value="1">February</option><option value="2">March</option><option value="3">April</option><option value="4">May</option><option value="5">June</option><option value="6">July</option><option value="7">August</option><option value="8">September</option><option value="9">October</option><option value="10">November</option><option value="11">December</option>
      </select>
    </div>
  </div>

  <div id="expList" class="space-y-2"></div>
  <div id="noExp" class="hidden bg-[#121212] border border-white/10 rounded-3xl p-10 text-center"><p class="text-4xl">📭</p><p class="font-black mt-2">কোনো খরচ নাই</p></div>

</div>

<!-- Add/Edit Modal -->
<div id="expModal" class="hidden fixed inset-0 bg-black/80 flex items-center justify-center z-[99] p-4">
  <div class="bg-[#121212] border border-white/10 rounded-3xl p-6 w-full max-w-md max-h-[90vh] overflow-y-auto">
    <div class="flex justify-between items-center mb-4">
      <h3 id="modalTitle" class="font-black">+ নতুন খরচ Add</h3>
      <button onclick="closeModal()" class="w-8 h-8 bg-white/10 rounded-full">✕</button>
    </div>
    <div class="space-y-3">
      <input id="expTitle" placeholder="খরচের নাম: যেমন Shop Rent / গাড়ি ভাড়া" class="w-full bg-black border border-white/10 rounded-full px-4 py-3 text-sm outline-none focus:border-[#FFC300]">
      <select id="expCategory" class="w-full bg-black border border-white/10 rounded-full px-4 py-3 text-sm">
        <option value="rent">🏠 Rent - ভাড়া</option>
        <option value="salary">👷 Salary - বেতন</option>
        <option value="current">💡 Current Bill - বিদ্যুৎ</option>
        <option value="delivery">🚚 Delivery Cost - কুরিয়ার</option>
        <option value="garivara">🚛 গাড়ি ভাড়া - Garivara</option>
        <option value="packaging">🛍️ Packaging - প্যাকেজিং</option>
        <option value="food">🍔 Food - খাবার</option>
        <option value="maintenance">🔧 Maintenance - মেরামত</option>
        <option value="marketing">📢 Marketing - বিজ্ঞাপন</option>
        <option value="others">📦 Others - অন্যান্য</option>
      </select>
      <input id="expAmount" type="number" placeholder="টাকার পরিমাণ" class="w-full bg-black border border-white/10 rounded-full px-4 py-3 text-sm outline-none focus:border-[#FFC300]">
      <input id="expDate" type="date" class="w-full bg-black border border-white/10 rounded-full px-4 py-3 text-sm">
      <select id="expPaidBy" class="w-full bg-black border border-white/10 rounded-full px-4 py-3 text-sm">
        <option value="cash">💵 Cash</option>
        <option value="bkash">📱 Bkash</option>
        <option value="nagad">📱 Nagad</option>
        <option value="bank">🏦 Bank</option>
      </select>
      <textarea id="expNote" placeholder="Note: কোথায় গাড়ি গেলো? কেন খরচ?" rows="2" class="w-full bg-black border border-white/10 rounded-2xl px-4 py-3 text-sm outline-none focus:border-[#FFC300]"></textarea>
      <button onclick="saveExp()" class="w-full bg-[#FFC300] text-black py-3 rounded-full text-sm font-black">💾 Save খরচ</button>
    </div>
  </div>
</div>

<script type="module">
import { db, auth } from "./firebase.js";
import { collection, getDocs, doc, getDoc, addDoc, updateDoc, deleteDoc, serverTimestamp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js";
import { onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-auth.js";

let allExp=[], filteredExp=[], currentFilter='all', editId=null;

onAuthStateChanged(auth, async (user)=>{
  if(!user) return location.href='admin-login.html';
  const snap = await getDoc(doc(db,"admins",user.uid));
  if(!snap.exists()) return location.href='admin-login.html';
  document.body.classList.remove('hidden');
  document.getElementById('loading').classList.add('hidden');
  document.getElementById('expDate').valueAsDate = new Date();
  loadExp();
});

async function loadExp(){
  const snap = await getDocs(collection(db,"expenses"));
  allExp=[];
  snap.forEach(d=>{
    const data=d.data();
    allExp.push({
      id:d.id,
      title:data.title||'Expense',
      category:data.category||'others',
      amount:Number(data.amount||0),
      date:data.date||'',
      note:data.note||'',
      paidBy:data.paidBy||'cash',
      rawDate: data.date? new Date(data.date) : (data.createdAt?.toDate()||new Date()),
      search:(data.title+' '+data.category+' '+data.note).toLowerCase()
    });
  });
  allExp.sort((a,b)=>b.rawDate-a.rawDate);
  filteredExp=[...allExp];
  render();
}

function render(){
  const today = new Date().toISOString().split('T')[0];
  const thisMonth = new Date().getMonth();
  const thisYear = new Date().getFullYear();
  const todayTotal = allExp.filter(e=>e.date===today).reduce((a,b)=>a+b.amount,0);
  const monthTotal = allExp.filter(e=>{ const d=new Date(e.date); return d.getMonth()===thisMonth && d.getFullYear()===thisYear; }).reduce((a,b)=>a+b.amount,0);
  const total = allExp.reduce((a,b)=>a+b.amount,0);
  const catCount={}; allExp.forEach(e=>{ catCount[e.category]=(catCount[e.category]||0)+e.amount; });
  let top='-'; let max=0; Object.entries(catCount).forEach(([k,v])=>{ if(v>max){max=v; top=k;} });
  document.getElementById('todayExp').innerText='৳'+todayTotal;
  document.getElementById('monthExp').innerText='৳'+monthTotal;
  document.getElementById('totalExp').innerText='৳'+total;
  document.getElementById('topCat').innerText= top!=='-'? top+' ৳'+max : '-';
  const listEl=document.getElementById('expList');
  const noEl=document.getElementById('noExp');
  if(filteredExp.length===0){ listEl.innerHTML=''; noEl.classList.remove('hidden'); return; }
  noEl.classList.add('hidden');
  listEl.innerHTML=filteredExp.map(e=>{
    const icon = {rent:'🏠',salary:'👷',current:'💡',delivery:'🚚',garivara:'🚛',packaging:'🛍️',food:'🍔',maintenance:'🔧',marketing:'📢',others:'📦'}[e.category]||'📦';
    return `
    <div class="bg-[#121212] border border-white/10 rounded-2xl p-4 flex justify-between items-center">
      <div class="flex gap-3 items-center">
        <div class="w-10 h-10 bg-white/10 rounded-full flex items-center justify-center text-lg">${icon}</div>
        <div>
          <p class="font-bold text-sm">${e.title} <span class="text-[10px] bg-white/10 px-2 py-0.5 rounded-full ml-1">${e.category.toUpperCase()}</span></p>
          <p class="text-xs text-white/40 mt-0.5">${e.date} • ${e.paidBy.toUpperCase()} ${e.note? '• '+e.note.slice(0,30):''}</p>
        </div>
      </div>
      <div class="text-right flex items-center gap-2">
        <div>
          <p class="font-black text-red-400">৳${e.amount}</p>
          <div class="flex gap-1 mt-1 justify-end">
            <button onclick="editExp('${e.id}')" class="w-6 h-6 bg-white/10 rounded-full text-[10px]">✏️</button>
            <button onclick="delExp('${e.id}')" class="w-6 h-6 bg-red-500/20 rounded-full text-[10px]">🗑️</button>
          </div>
        </div>
      </div>
    </div>
    `;
  }).join('');
}

window.openAdd=()=>{
  editId=null;
  document.getElementById('modalTitle').innerText='+ নতুন খরচ Add';
  document.getElementById('expTitle').value='';
  document.getElementById('expCategory').value='rent';
  document.getElementById('expAmount').value='';
  document.getElementById('expDate').valueAsDate = new Date();
  document.getElementById('expPaidBy').value='cash';
  document.getElementById('expNote').value='';
  document.getElementById('expModal').classList.remove('hidden');
}
window.closeModal=()=>{ document.getElementById('expModal').classList.add('hidden'); }
window.editExp=(id)=>{
  const e=allExp.find(x=>x.id===id); if(!e) return;
  editId=id;
  document.getElementById('modalTitle').innerText='✏️ Edit খরচ';
  document.getElementById('expTitle').value=e.title;
  document.getElementById('expCategory').value=e.category;
  document.getElementById('expAmount').value=e.amount;
  document.getElementById('expDate').value=e.date;
  document.getElementById('expPaidBy').value=e.paidBy;
  document.getElementById('expNote').value=e.note;
  document.getElementById('expModal').classList.remove('hidden');
}
window.saveExp=async()=>{
  const title=document.getElementById('expTitle').value.trim();
  const category=document.getElementById('expCategory').value;
  const amount=Number(document.getElementById('expAmount').value);
  const date=document.getElementById('expDate').value;
  const paidBy=document.getElementById('expPaidBy').value;
  const note=document.getElementById('expNote').value.trim();
  if(!title) return alert('Title দাও');
  if(!amount) return alert('Amount দাও');
  if(!date) return alert('Date দাও');
  try{
    const payload={title, category, amount, date, paidBy, note, createdAt:serverTimestamp()};
    if(editId){ await updateDoc(doc(db,"expenses",editId),payload); }
    else{ await addDoc(collection(db,"expenses"),payload); }
    closeModal(); loadExp();
  }catch(err){ alert(err.message); }
}
window.delExp=async(id)=>{
  if(!confirm('Delete করবা?')) return;
  try{ await deleteDoc(doc(db,"expenses",id)); loadExp(); }catch(e){ alert(e.message); }
}
window.setCatFilter=(cat)=>{
  currentFilter=cat;
  document.querySelectorAll('.catBtn').forEach(b=>{b.classList.remove('bg-[#FFC300]','text-black'); b.classList.add('bg-white/10');});
  document.getElementById('c-'+cat).classList.add('bg-[#FFC300]','text-black');
  document.getElementById('c-'+cat).classList.remove('bg-white/10');
  filterExp();
}
window.filterExp=()=>{
  const q=document.getElementById('searchBox').value.toLowerCase();
  const date=document.getElementById('filterDate').value;
  const month=document.getElementById('filterMonth').value;
  let list=[...allExp];
  if(currentFilter!=='all') list=list.filter(e=>e.category===currentFilter);
  if(date) list=list.filter(e=>e.date===date);
  if(month!=='all') list=list.filter(e=> new Date(e.date).getMonth()===Number(month));
  if(q) list=list.filter(e=> e.search.includes(q));
  filteredExp=list;
  render();
}
</script>
</body>
</html>
